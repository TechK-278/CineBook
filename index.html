<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CineBook - Premium Movie Discovery & Ticket Booking Single Page Application">
    <title>CineBook — Movie Discovery & Ticket Booking</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons 1.11.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CineBook CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cinebook-base text-cinebook-primary">

    <!-- Application Navigation -->
    <header>
        <nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark bg-cinebook-nav border-bottom border-cinebook sticky-top py-2">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#" data-view="home">
                    <span class="brand-icon d-inline-flex align-items-center justify-content-center">
                        <i class="bi bi-film text-cinebook-accent fs-4"></i>
                    </span>
                    <span class="fw-bold tracking-tight text-white fs-5">Cine<span class="text-cinebook-accent">Book</span></span>
                </a>

                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="bi bi-list fs-3 text-white"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-view="home">
                                <i class="bi bi-house-door me-1"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-view="movies">
                                <i class="bi bi-collection-play me-1"></i> Movies
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-view="bookings">
                                <i class="bi bi-ticket-perforated me-1"></i> My Bookings
                            </a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-icon-nav" id="btn-search-toggle" aria-label="Search movies">
                            <i class="bi bi-search"></i>
                        </button>
                        <button class="btn btn-cinebook-surface btn-sm d-flex align-items-center gap-2 px-3 py-2" id="btn-profile" data-view="profile">
                            <i class="bi bi-person-circle"></i>
                            <span class="d-none d-sm-inline font-medium">Profile</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main SPA View Mount Point -->
    <main id="app-root" class="app-viewport py-4">
        <!-- SPA views will be dynamically injected here by the UI controller -->
        <div class="container text-center py-5">
            <div class="py-5">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-cinebook-surface mb-3 border border-cinebook">
                    <i class="bi bi-film text-cinebook-accent fs-1"></i>
                </div>
                <h1 class="h3 fw-bold text-white mb-2">CineBook Single Page Application</h1>
                <p class="text-cinebook-secondary mx-auto max-w-lg mb-4">
                    Phase 0 initialization complete. Frontend architecture, design tokens, and modular structure established.
                </p>
                <div class="d-inline-flex gap-2">
                    <span class="badge bg-cinebook-surface border border-cinebook text-cinebook-secondary px-3 py-2">
                        <i class="bi bi-check2-circle text-success me-1"></i> Architecture Ready
                    </span>
                    <span class="badge bg-cinebook-surface border border-cinebook text-cinebook-secondary px-3 py-2">
                        <i class="bi bi-palette text-info me-1"></i> Design Tokens Loaded
                    </span>
                </div>
            </div>
        </div>
    </main>

    <!-- Application Footer -->
    <footer class="bg-cinebook-secondary border-top border-cinebook mt-auto py-4">
        <div class="container text-center">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-film text-cinebook-accent"></i>
                    <span class="fw-semibold text-white">CineBook</span>
                    <span class="text-cinebook-muted fs-7">© 2026</span>
                </div>
                <div class="text-cinebook-muted fs-7">
                    Modern Movie Discovery & Ticket Booking SPA
                </div>
            </div>
        </div>
    </footer>

    <!-- Global Modal Host -->
    <div class="modal fade" id="cinebook-modal" tabindex="-1" aria-labelledby="cinebookModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-cinebook-surface border border-cinebook">
                <div class="modal-header border-bottom border-cinebook">
                    <h5 class="modal-title text-white" id="cinebookModalLabel">Modal Title</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="cinebook-modal-body">
                    <!-- Dynamic modal body -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Vendor Dependencies -->
    <!-- jQuery 3.7.1 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- Bootstrap 5.3.3 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- CineBook Application Modules -->
    <script src="js/storage.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
